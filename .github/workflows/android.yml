name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      android_version:
        description: Android version for the emulator
        type: choice
        default: '15'
        options: ['15', '17']

permissions:
  contents: read

env:
  DOWNLOADER_MAVEN_CENTRAL: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify debug APK signature and checksum
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk"
      - name: Count passing unit tests
        run: |
          python - <<'PYTHON'
          import glob
          from xml.etree import ElementTree
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          suites = [ElementTree.parse(file).getroot() for file in files]
          count = sum(int(suite.attrib['tests']) for suite in suites)
          print(f'{count} unit tests passed')
          assert count > 0
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: Downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - run: gradle --no-daemon :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-checks
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate unprotected media fixtures
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          bash scripts/device-fixtures.sh
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '36'
          system-image-api-level: ${{ inputs.android_version == '17' && '37.0' || '35' }}
          target: google_apis
          emulator-boot-timeout: 360
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-checks
          path: app/build/outputs/androidTest-results/connected/
